<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes con mayor cantidad de reportes - Estadísticas v2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f0f2f5;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            margin: auto;
            height: 500px; /* Aumentado para dar espacio a las etiquetas */
            width: 100%;
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        
        .badge-warning {
            background-color: #ffebee;
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Reporte del Kardex digital - Unidad Educativa San Lorenzo</h1>
        <p>Top 10 Estudiantes con más llamadas de atención</p>
    </header>

    <div class="chart-container">
        <canvas id="graficoBarras"></canvas>
    </div>

    <table id="tabla-estudiantes">
        <thead>
            <tr>
                <th>Curso</th>
                <th>C.I. Estudiante</th>
                <th>Llamados</th>
            </tr>
        </thead>
        <tbody id="contenido-tabla">
            <tr><td colspan="3" style="text-align:center">Cargando datos...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1BBlw5DtYfNdkbMUfOTHynlWGPLFohmFGbwHAAKnP8q88vWPkk21s7AyR3xpmidSeuTF9mokFkYVi/pub?gid=168130559&single=true&output=csv';

    let miGrafico;

    async function obtenerDatos() {
        try {
            const respuesta = await fetch(SHEET_URL, { cache: "no-store" });
            const csvTexto = await respuesta.text();
            const filas = csvTexto.split(/\r?\n/).filter(linea => linea.trim() !== "");
            
            let estudiantes = [];
            for (let i = 1; i < filas.length; i++) {
                const columnas = filas[i].split(/[,;]/);
                if (columnas.length >= 3) {
                    estudiantes.push({
                        curso: columnas[0].trim(),
                        ci: columnas[1].trim(),
                        llamadas: parseInt(columnas[2].trim()) || 0
                    });
                }
            }

            estudiantes.sort((a, b) => b.llamadas - a.llamadas);
            
            // Tomamos el top 10
            const topEstudiantes = estudiantes.slice(0, 10);
            
            dibujarTabla(estudiantes);
            generarGrafico(topEstudiantes);

        } catch (error) {
            console.error("Error:", error);
        }
    }

    function definirColor(valor) {
        if (valor >= 5) return '#e74c3c'; // Rojo
        if (valor >= 3) return '#f39c12'; // Amarillo/Naranja
        return '#2ecc71'; // Verde
    }

    function generarGrafico(datos) {
        const ctx = document.getElementById('graficoBarras').getContext('2d');
        
        // Formateamos la etiqueta para que incluya CI y Curso
        const etiquetas = datos.map(e => `${e.ci} (${e.curso})`);
        const valores = datos.map(e => e.llamadas);
        const colores = datos.map(e => definirColor(e.llamadas));

        if (miGrafico) miGrafico.destroy();

        miGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: etiquetas,
                datasets: [{
                    label: 'Llamados de Atención',
                    data: valores,
                    backgroundColor: colores,
                    borderRadius: 8,
                    barThickness: 30
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { 
                        beginAtZero: true,
                        ticks: { stepSize: 1 }
                    },
                    y: { 
                        ticks: {
                            crossAlign: 'far', // Alinea el texto a la derecha (hacia la barra)
                            font: {
                                size: 13,
                                weight: 'bold'
                            }
                        },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function dibujarTabla(datos) {
        const cuerpo = document.getElementById('contenido-tabla');
        cuerpo.innerHTML = '';
        datos.forEach(est => {
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${est.curso}</td>
                <td>${est.ci}</td>
                <td><span class="${est.llamadas > 0 ? 'badge-warning' : ''}">${est.llamadas}</span></td>
            `;
            cuerpo.appendChild(fila);
        });
    }

    obtenerDatos();
</script>

</body>
</html>
